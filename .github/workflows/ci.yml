name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # el service worker debe salir con su versión y su lista de archivos rellenadas
      - run: "! grep -q '__VERSION__\\|= __PRECACHE__;' dist/sw.js"
